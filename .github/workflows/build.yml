name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: sbcl --script scripts/tests/test-run.lisp
      - run: sbcl --script scripts/tests/test-tunnel.lisp
      - run: npm --prefix web ci && npm --prefix web test
      - run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CraftLink-Forge-1.20.1
          path: build/libs/craftlink-forge-1.20.1-0.1.0.jar
