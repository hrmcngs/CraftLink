services:
  - type: web
    name: craftlink-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CRAFTLINK_RELAY_SECRET
        generateValue: true
