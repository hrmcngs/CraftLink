plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.spongepowered.mixin' version '0.7.38'
}
version = '0.1.0'
group = 'dev.craftlink'
base { archivesName = 'craftlink-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
def craftlinkRemote = providers.gradleProperty('craftlinkRemote').map { it.toBoolean() }.getOrElse(false)
def craftlinkLogin = providers.gradleProperty('craftlinkLogin').map { it.toBoolean() }.getOrElse(false)
def craftlinkCachedLogin = providers.gradleProperty('craftlinkCachedLogin').map { it.toBoolean() }.getOrElse(false)
if (craftlinkLogin && craftlinkCachedLogin) throw new GradleException('Choose online login or cached identity, not both.')
def cachedIdentity = null
if (craftlinkCachedLogin) {
    def identityFile = file('.craftlink/identity.json')
    if (!identityFile.isFile() || java.nio.file.Files.isSymbolicLink(identityFile.toPath()) || identityFile.length() > 1024) throw new GradleException('保存済みの本人情報がありません。自宅などで sh run.sh --login を実行し、タイトル画面まで起動してください。--prepareだけでは保存されません。')
    cachedIdentity = new groovy.json.JsonSlurper().parse(identityFile)
    if (!(cachedIdentity.name instanceof String) || !(cachedIdentity.name ==~ /[A-Za-z0-9_]{1,16}/) || !(cachedIdentity.uuid instanceof String) || !(cachedIdentity.uuid ==~ /[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/)) throw new GradleException('保存済みの本人情報が不正です。自宅で sh run.sh --login を実行し直してください。')
}
def craftlinkTransport = providers.gradleProperty('craftlinkTransport').getOrElse('lan')
if (!(craftlinkTransport in ['lan', 'usb'])) throw new GradleException('craftlinkTransport must be lan or usb')
def craftlinkPort = providers.gradleProperty('craftlinkPort').orNull
if (craftlinkPort != null && (!(craftlinkPort ==~ /[0-9]{1,5}/) || craftlinkPort.toInteger() < 1024 || craftlinkPort.toInteger() > 65535)) {
    throw new GradleException('craftlinkPort must be 1024..65535')
}
sourceSets {
    devClient {
        java.srcDirs = []
        resources.srcDirs = []
        output.classesDirs.setFrom(files(layout.buildDirectory.dir('dev-client')).builtBy('prepareDevClient'))
        output.resourcesDir = layout.buildDirectory.dir('dev-client').get().asFile
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file(providers.gradleProperty('craftlinkRunDirectory').getOrElse('run'))
            jvmArgs '-Xmx2G'
            property 'craftlink.transport', craftlinkTransport
            if (craftlinkLogin) {
                property 'devauth.enabled', 'true'
                property 'devauth.account', 'main'
                property 'devauth.configDir', file('.craftlink/dev-auth').absolutePath
                property 'craftlink.identityCache', file('.craftlink/identity.json').absolutePath
            }
            if (craftlinkCachedLogin) args '--username', cachedIdentity.name, '--uuid', cachedIdentity.uuid, '--accessToken', '0', '--userType', 'legacy'
            if (providers.gradleProperty('craftlinkExternalUrl').isPresent()) property 'craftlink.externalUrl', providers.gradleProperty('craftlinkExternalUrl').get()
            if (providers.gradleProperty('craftlinkSchoolMode').isPresent()) property 'craftlink.schoolMode', providers.gradleProperty('craftlinkSchoolMode').get()
            if (craftlinkPort != null) property 'craftlink.port', craftlinkPort
            mods { craftlink { source sourceSets.devClient } }
        }
    }
}
repositories { maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1'; content { includeGroup 'me.djtheredstoner' } }; mavenCentral(); maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
def withModpack = providers.gradleProperty('craftlinkModpack').map { it.toBoolean() }.getOrElse(false)
def modpackManifest = file('.craftlink/modpack/manifest.json')
def weapons = null
if (withModpack) {
    if (!modpackManifest.isFile()) throw new GradleException('先に sh build-mods.sh を実行してください。')
    weapons = new groovy.json.JsonSlurper().parse(modpackManifest)
    repositories {
        maven { url = 'https://maven.theillusivec4.top/' }
        flatDir { dirs file('.craftlink/modpack') }
    }
}
configurations { modpackDistribution }
// The launch uses devClient output, so its runtime must inherit optional Mods too.
configurations.devClientRuntimeOnly.extendsFrom(configurations.runtimeOnly)
mixin { add sourceSets.main, 'craftlink.refmap.json'; config 'craftlink.mixins.json' }
configurations { embedded }
dependencies {
    if (craftlinkLogin) runtimeOnly 'me.djtheredstoner:DevAuth-forge-latest:1.2.2'
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    embedded 'com.google.zxing:core:3.5.3'
    embedded 'io.netty:netty-codec-http:4.1.137.Final'
    implementation 'io.netty:netty-codec-http:4.1.137.Final'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    if (withModpack) {
        runtimeOnly fg.deobf("craftlink.local:weapons:${weapons.sha256}")
        runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
        modpackDistribution('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1') { transitive = false }
    }
}
tasks.register('modpack', Sync) {
    dependsOn 'build'
    onlyIf { withModpack }
    into layout.buildDirectory.dir('modpack/mods')
    from tasks.shadowJar.archiveFile
    from configurations.modpackDistribution
    if (withModpack) from(file(".craftlink/modpack/weapons-${weapons.sha256}.jar")) { rename { 'The-four-primitives-and-Weapons.jar' } }
}
if (withModpack) {
    // Stage these before configuring ForgeGradle: resolving a Mod configuration here
    // would lock repositories before ForgeGradle installs its remapping filters.
    for (def name : ['curios', 'weapons']) {
        def rules = file(".craftlink/modpack/access-${name}.cfg")
        if (!rules.isFile()) throw new GradleException('先に sh build-mods.sh を実行してModのアクセス設定を更新してください。')
        minecraft.accessTransformer rules
    }
}

def webOffline = providers.gradleProperty('webOffline').map { it.toBoolean() }.getOrElse(false)
tasks.register('webInstall', Exec) {
    workingDir 'web'
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
    inputs.file('web/package-lock.json')
    outputs.dir('web/node_modules')
    onlyIf { !webOffline }
}
tasks.register('verifyOfflineWeb') {
    onlyIf { webOffline }
    doLast {
        if (!file('web/node_modules/typescript/bin/tsc').exists() || !file('web/node_modules/vite/bin/vite.js').exists()) {
            throw new GradleException('Offline web dependencies missing. Run bash scripts/build.sh online first.')
        }
        if (!file('web/node_modules/.package-lock.json').exists()) {
            throw new GradleException('Offline npm lock missing. Run bash scripts/build.sh online first.')
        }
        def parser = new groovy.json.JsonSlurper()
        def locked = parser.parse(file('web/package-lock.json')).packages
        def installed = parser.parse(file('web/node_modules/.package-lock.json')).packages
        locked.each { path, expected ->
            // Optional platform binaries may legitimately be absent on this machine.
            if (path && !expected.optional && installed[path]?.version != expected.version) {
                throw new GradleException("Offline npm dependencies differ from lockfile: ${path}. Run bash scripts/build.sh online first.")
            }
        }
    }
}
tasks.register('webBuild', Exec) { dependsOn 'webInstall', 'verifyOfflineWeb'; workingDir 'web'; commandLine 'npm', 'run', 'build'; inputs.files(fileTree('web/src'), 'web/index.html', 'web/classroom.html', 'web/vite.config.ts', 'web/tsconfig.json', 'web/package.json', 'web/package-lock.json'); outputs.dir('web/dist') }
def networkPolicyDirectory = layout.buildDirectory.dir('generated/network-policy')
tasks.register('generateNetworkPolicy') {
    inputs.property('remoteAccess', craftlinkRemote)
    outputs.dir(networkPolicyDirectory)
    doLast {
        def output = networkPolicyDirectory.get().file('craftlink-network.properties').asFile
        output.parentFile.mkdirs()
        output.text = "remoteAccess=${craftlinkRemote}\n"
    }
}
processResources { dependsOn 'generateNetworkPolicy'; from(networkPolicyDirectory); dependsOn 'webBuild'; from('web/dist') { into 'web' } }
jar { archiveClassifier = 'thin' }
shadowJar {
    archiveClassifier = ''
    manifest { attributes 'MixinConfigs': 'craftlink.mixins.json' }
    configurations = [project.configurations.embedded]
    relocate 'io.netty', 'dev.craftlink.internal.netty'
    relocate 'com.google.zxing', 'dev.craftlink.internal.zxing'
    exclude 'META-INF/services/reactor.blockhound.integration.BlockHoundIntegration', 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
reobf { shadowJar {} }
shadowJar.finalizedBy 'reobfShadowJar'
build.dependsOn shadowJar

// A standalone host kit: no development project paths or third-party mods.
tasks.register('hostDistribution', Zip) {
    doFirst {
        if (craftlinkRemote) throw new GradleException('Host kits must be local-only. Build without -PcraftlinkRemote=true.')
    }
    dependsOn 'shadowJar', 'reobfShadowJar'
    archiveFileName = "craftlink-host-forge-1.20.1-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(tasks.named('shadowJar').flatMap { it.archiveFile }) { into 'mods' }
    from('docs/HOST_SETUP.md') { rename { '導入手順.md' } }
    from('LICENSE')
}
build.dependsOn tasks.named('hostDistribution')

test { useJUnitPlatform() }

// Run the same relocated libraries as the distribution, without production name remapping.
tasks.register('devShadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    dependsOn classes
    from sourceSets.main.output
    archiveClassifier = 'dev'
    configurations = [project.configurations.embedded]
    relocate 'io.netty', 'dev.craftlink.internal.netty'
    relocate 'com.google.zxing', 'dev.craftlink.internal.zxing'
    manifest { attributes 'MixinConfigs': 'craftlink.mixins.json' }
    exclude 'META-INF/services/reactor.blockhound.integration.BlockHoundIntegration', 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
tasks.register('prepareDevClient', Sync) {
    dependsOn devShadowJar
    from { zipTree(tasks.devShadowJar.archiveFile.get().asFile) }
    into layout.buildDirectory.dir('dev-client')
}
// Forge's early splash can fail to enumerate the primary display on macOS.
// Apply before Forge loads, for shell, VS Code and school launcher alike.
tasks.register('prepareMacDisplay') {
    onlyIf { System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('mac') }
    doLast {
        def configFile = project.file(providers.gradleProperty('craftlinkRunDirectory').getOrElse('run') + '/config/fml.toml')
        def original = configFile.exists() ? configFile.getText('UTF-8') : ''
        // Restrict the setting to the TOML root; leave any tables untouched.
        def table = (original =~ /(?m)^\s*\[/)
        def boundary = table.find() ? table.start() : original.length()
        def root = original.substring(0, boundary)
        def key = ~/(?m)^[ \t]*earlyWindowControl[ \t]*=[^\r\n]*/
        def updated = (root =~ key).find()
            ? root.replaceAll(key, 'earlyWindowControl = false')
            : root + (root && !root.endsWith('\n') ? '\n' : '') + 'earlyWindowControl = false\n'
        updated += original.substring(boundary)
        if (updated != original) {
            configFile.parentFile.mkdirs()
            def backup = new File(configFile.parentFile, 'fml.toml.craftlink-backup')
            if (configFile.exists() && !backup.exists()) backup.setText(original, 'UTF-8')
            configFile.setText(updated, 'UTF-8')
            logger.lifecycle('CraftLink: macOSのForge起動用スプラッシュを無効化しました（通常のゲーム描画は有効）。')
        }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'prepareDevClient', 'prepareMacDisplay' }

// Resolve authentication only on explicit developer verification; never launch the game here.
tasks.register('verifyDevLogin') {
    doLast {
        if (!craftlinkLogin) throw new GradleException('Use -PcraftlinkLogin=true to verify development login.')
        if (minecraft.runs.client.properties['devauth.account'] != 'main') throw new GradleException('The authenticated client must select the main Microsoft account.')
        def auth = configurations.devClientRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'me.djtheredstoner' && it.name == 'DevAuth-forge-latest'
        }
        if (auth == null || !auth.file.isFile()) throw new GradleException('DevAuth is missing from the development runtime.')
        logger.lifecycle("CraftLink: DevAuth ${auth.moduleVersion.id.version} is present on the development runtime with Microsoft account profile main; no account credentials were read.")
    }
}
